name: Fetch GitHub Data

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch GitHub + AI model data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/fetch-github-data.cjs || echo "GitHub 数据抓取跳过"
          node scripts/fetch-ai-data.cjs || echo "AI 数据抓取跳过"

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-data.json assets/ai-data.json
          if git diff --cached --quiet; then
            echo "No changes, skipping commit."
          else
            # 不用 [skip ci]：让数据提交触发 CI + 部署，线上站点才能拿到最新数据
            git commit -m "chore: update daily data (stars + AI pricing)"
            git push
          fi
